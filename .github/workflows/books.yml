name: Sync Book Reviews

on:
  schedule:
    - cron: '0 5 * * *'   # daily at 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Checkout Obsidian vault (ubiquitous-enigma/sources)
        uses: actions/checkout@v4
        with:
          repository: ubiquitous-enigma/sources
          path: _vault
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build books.json
        env:
          VAULT_DIR: ./_vault
          QUARTZ_BASE: https://lakshya-aga.github.io/quartz
        run: node scripts/fetch-books.js

      - name: Commit books.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add books.json
          if git diff --staged --quiet; then
            echo "No book changes."
          else
            git commit -m "chore: refresh book reviews"
            git push
          fi
